# Netlify build + routing config for betterbodybootcamp.com.
# Vite/React SPA at root, owner dashboard reverse-proxied to bbbmarketing.netlify.app at /dashboard.

[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# /dashboard and /dashboard/* are reverse-proxied to the standalone owner dashboard.
# URL bar stays as betterbodybootcamp.com/dashboard; content comes from bbbmarketing.
[[redirects]]
  from   = "/dashboard"
  to     = "https://bbbmarketing.netlify.app/"
  status = 200
  force  = true

[[redirects]]
  from   = "/dashboard/*"
  to     = "https://bbbmarketing.netlify.app/:splat"
  status = 200
  force  = true

# /homebase reverse-proxies to the front-desk Kanban portal.
# Clean URL for the studio team — they bookmark betterbodybootcamp.com/homebase.
[[redirects]]
  from   = "/homebase"
  to     = "https://bbbmarketing.netlify.app/frontdesk.html"
  status = 200
  force  = true

[[redirects]]
  from   = "/homebase/*"
  to     = "https://bbbmarketing.netlify.app/:splat"
  status = 200
  force  = true

# Tracked marketing links. betterbodybootcamp.com/ig|email|flyer/<studio> →
# the track-link edge function, which logs the click in link_clicks and then
# 302s on to /trial/<studio> with the UTM params.
# NOTE: netlify.toml redirects are evaluated BEFORE public/_redirects, so the
# tracked-link rules must live here — keep this list and _redirects in sync.
[[redirects]]
  from   = "/ig/astoria"
  to     = "https://uracuwugpxqjfgtuobal.supabase.co/functions/v1/track-link?l=ig-astoria"
  status = 302

[[redirects]]
  from   = "/ig/bayside"
  to     = "https://uracuwugpxqjfgtuobal.supabase.co/functions/v1/track-link?l=ig-bayside"
  status = 302

[[redirects]]
  from   = "/ig/fresh-meadows"
  to     = "https://uracuwugpxqjfgtuobal.supabase.co/functions/v1/track-link?l=ig-fresh-meadows"
  status = 302

[[redirects]]
  from   = "/ig/williamsburg"
  to     = "https://uracuwugpxqjfgtuobal.supabase.co/functions/v1/track-link?l=ig-williamsburg"
  status = 302

# Email-campaign links — all studios. Tagged utm_source=email.
[[redirects]]
  from   = "/email/astoria"
  to     = "https://uracuwugpxqjfgtuobal.supabase.co/functions/v1/track-link?l=email-astoria"
  status = 302

[[redirects]]
  from   = "/email/bayside"
  to     = "https://uracuwugpxqjfgtuobal.supabase.co/functions/v1/track-link?l=email-bayside"
  status = 302

[[redirects]]
  from   = "/email/fresh-meadows"
  to     = "https://uracuwugpxqjfgtuobal.supabase.co/functions/v1/track-link?l=email-fresh-meadows"
  status = 302

[[redirects]]
  from   = "/email/williamsburg"
  to     = "https://uracuwugpxqjfgtuobal.supabase.co/functions/v1/track-link?l=email-williamsburg"
  status = 302

# Printed-flyer links — all studios. Tagged utm_source=flyer.
[[redirects]]
  from   = "/flyer/astoria"
  to     = "https://uracuwugpxqjfgtuobal.supabase.co/functions/v1/track-link?l=flyer-astoria"
  status = 302

[[redirects]]
  from   = "/flyer/bayside"
  to     = "https://uracuwugpxqjfgtuobal.supabase.co/functions/v1/track-link?l=flyer-bayside"
  status = 302

[[redirects]]
  from   = "/flyer/fresh-meadows"
  to     = "https://uracuwugpxqjfgtuobal.supabase.co/functions/v1/track-link?l=flyer-fresh-meadows"
  status = 302

[[redirects]]
  from   = "/flyer/williamsburg"
  to     = "https://uracuwugpxqjfgtuobal.supabase.co/functions/v1/track-link?l=flyer-williamsburg"
  status = 302

# SPA fallback for everything else — React Router handles client-side routing.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
