# Netlify build + routing config for betterbodybootcamp.com.
# Vite/React SPA at root, owner dashboard reverse-proxied to bbbmarketing.netlify.app at /dashboard.

[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# /dashboard and /dashboard/* are reverse-proxied to the standalone owner dashboard.
# URL bar stays as betterbodybootcamp.com/dashboard; content comes from bbbmarketing.
[[redirects]]
  from   = "/dashboard"
  to     = "https://bbbmarketing.netlify.app/"
  status = 200
  force  = true

[[redirects]]
  from   = "/dashboard/*"
  to     = "https://bbbmarketing.netlify.app/:splat"
  status = 200
  force  = true

# /homebase reverse-proxies to the front-desk Kanban portal.
# Clean URL for the studio team — they bookmark betterbodybootcamp.com/homebase.
[[redirects]]
  from   = "/homebase"
  to     = "https://bbbmarketing.netlify.app/frontdesk.html"
  status = 200
  force  = true

[[redirects]]
  from   = "/homebase/*"
  to     = "https://bbbmarketing.netlify.app/:splat"
  status = 200
  force  = true

# Short, branded Instagram links. betterbodybootcamp.com/ig/<studio> →
# the studio trial page, carrying Instagram UTM tags into the funnel.
[[redirects]]
  from   = "/ig/astoria"
  to     = "/trial/astoria?utm_source=instagram&utm_medium=social&utm_campaign=trial&utm_content=bio"
  status = 302

[[redirects]]
  from   = "/ig/bayside"
  to     = "/trial/bayside?utm_source=instagram&utm_medium=social&utm_campaign=trial&utm_content=bio"
  status = 302

[[redirects]]
  from   = "/ig/fresh-meadows"
  to     = "/trial/fresh-meadows?utm_source=instagram&utm_medium=social&utm_campaign=trial&utm_content=bio"
  status = 302

[[redirects]]
  from   = "/ig/williamsburg"
  to     = "/trial/williamsburg?utm_source=instagram&utm_medium=social&utm_campaign=trial&utm_content=bio"
  status = 302

# SPA fallback for everything else — React Router handles client-side routing.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
